; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[project]
version = 1.0.5

[platformio]
default_envs = esp32-s3-devkitc-1
extra_configs = secrets.ini

[env:esp32-s3-devkitc-1]
; Arduino-ESP32 3.2.0 / ESP-IDF 5.4.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_protocol = esptool

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Quad flash + Octal PSRAM
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -D CURRENT_VERSION=\"${project.version}\"
    -D OTA_URL=\"https://kubis15.github.io/ArdEspIDF_OTA/\"
    -D AP_PASSWORD=\"${secrets.ap_password}\"
    -D WIFI_SSID_DEFAULT=\"${secrets.wifi_ssid}\"
    -D WIFI_PASS_DEFAULT=\"${secrets.wifi_pass}\"
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    -D CORE_DEBUG_LEVEL=3

lib_compat_mode = strict
lib_ldf_mode = chain
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
    
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.15.5
    bblanchon/ArduinoJson @ 7.4.3
    ESP32Async/AsyncTCP @ ^3.5.0
    ESP32Async/ESPAsyncWebServer @ ^3.12.0

custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-dsp
    espressif/esp32-camera
    espressif/libsodium
    espressif/esp-modbus
    espressif/qrcode
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common
   

upload_port = COM7
upload_speed = 921600
